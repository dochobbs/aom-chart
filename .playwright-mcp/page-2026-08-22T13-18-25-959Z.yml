      - 'heading "Mid 2025: Stumbling Agents" [level=2] [ref=e122]'
      - paragraph [ref=e123]: The world sees its first glimpse of AI agents.
      - paragraph [ref=e124]:
        - text: "Advertisements for computer-using agents emphasize the term “personal assistant”: you can prompt them with tasks like “order me a burrito on DoorDash” or “open my budget spreadsheet and sum this month’s expenses.” They will check in with you as needed: for example, to ask you to confirm purchases."
        - superscript [ref=e125] [cursor=pointer]:
          - link "8" [ref=e126]:
            - /url: /footnotes#footnote-8
        - text: Though more advanced than previous iterations like
        - link "Operator" [ref=e127] [cursor=pointer]:
          - /url: https://openai.com/index/introducing-operator/
        - text: ", they struggle to get widespread usage."
        - superscript [ref=e128] [cursor=pointer]:
          - link "9" [ref=e129]:
            - /url: /footnotes#footnote-9
      - paragraph [ref=e130]: Meanwhile, out of public focus, more specialized coding and research agents are beginning to transform their professions.
      - paragraph [ref=e131]:
        - text: "The AIs of 2024 could follow specific instructions: they could turn bullet points into emails, and simple requests into working code. In 2025, AIs function more like employees. Coding AIs increasingly look like autonomous agents rather than mere assistants: taking instructions via Slack or Teams and making substantial code changes on their own, sometimes saving hours or even days."
        - superscript [ref=e132] [cursor=pointer]:
          - link "10" [ref=e133]:
            - /url: /footnotes#footnote-10
        - text: Research agents spend half an hour scouring the Internet to answer your question.
      - paragraph [ref=e134]:
        - text: The agents are impressive in theory (and in cherry-picked examples), but in practice unreliable. AI twitter is full of stories about tasks bungled in some particularly hilarious way. The better agents are also expensive; you get what you pay for, and the best performance costs hundreds of dollars a month.
        - superscript [ref=e135] [cursor=pointer]:
          - link "11" [ref=e136]:
            - /url: /footnotes#footnote-11
        - text: Still, many companies find ways to fit AI agents into their workflows.
        - superscript [ref=e137] [cursor=pointer]:
          - link "12" [ref=e138]:
            - /url: /footnotes#footnote-12
