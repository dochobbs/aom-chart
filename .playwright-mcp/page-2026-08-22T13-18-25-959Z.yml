    - generic [ref=e641]:
      - 'heading "July 2027: The Cheap Remote Worker" [level=2] [ref=e642]'
      - paragraph [ref=e643]: Trailing U.S. AI companies release their own AIs, approaching that of OpenBrain’s automated coder from January. Recognizing their increasing lack of competitiveness, they push for immediate regulations to slow OpenBrain, but are too late—OpenBrain has enough buy-in from the President that they will not be slowed.
      - paragraph [ref=e644]: In response, OpenBrain announces that they’ve achieved AGI and releases Agent-3-mini to the public.
      - paragraph [ref=e645]
      - paragraph [ref=e649]:
        - text: It blows the other AIs out of the water. Agent-3-mini is less capable than Agent-3, but 10x cheaper, and still better than the typical OpenBrain employee.
        - superscript [ref=e650] [cursor=pointer]:
          - link "67" [ref=e651]:
            - /url: /footnotes#footnote-67
        - text: Silicon Valley reaches a tipping point. Tech gurus announce that AGI and superintelligence are near, the AI safety community is panicking, and investors shovel billions into AI wrapper startups, desperate to capture a piece of the pie. Hiring new programmers has nearly stopped, but there’s never been a better time to be a consultant on integrating AI into your business.
      - paragraph [ref=e652]: It’s not popular. The public still thinks of AI as a Big Tech plot to steal their jobs; OpenBrain has a net approval of -35% (25% approve, 60% disapprove, and 15% unsure).
      - paragraph [ref=e653]:
        - text: A week before release, OpenBrain gave Agent-3-mini to a set of external evaluators for safety testing. Preliminary results suggest that it’s extremely dangerous. A third-party evaluator finetunes it on publicly available biological weapons data
        - superscript [ref=e654] [cursor=pointer]:
          - link "68" [ref=e655]:
            - /url: /footnotes#footnote-68
        - text: and sets it to provide detailed instructions for human amateurs designing a bioweapon—it looks to be scarily effective at doing so. If the model weights fell into terrorist hands, the government believes there is a significant chance it could succeed at destroying civilization.
      - paragraph [ref=e656]: Fortunately, it’s extremely robust to jailbreaks, so while the AI is running on OpenBrain’s servers, terrorists won’t be able to get much use out of it.
      - paragraph [ref=e657]:
        - text: Agent-3-mini is hugely useful for both remote work jobs and leisure. An explosion of new apps and
        - link "B2B SAAS" [ref=e658] [cursor=pointer]:
          - /url: https://encharge.io/what-is-b2b-saas/
        - text: products rocks the market. Gamers get amazing dialogue with lifelike characters in polished video games that took only a month to make. 10% of Americans, mostly young people, consider an AI “a close friend.” For almost every white-collar profession, there are now multiple credible startups promising to “disrupt” it with AI.
      - paragraph [ref=e659]: The public conversation is confused and chaotic. Hypesters are doing victory laps. Skeptics are still pointing out the things Agent-3-mini can’t do. Everyone knows something big is happening but no one agrees on what it is.
    - generic [ref=e660]:
      - 'heading "August 2027: The Geopolitics of Superintelligence" [level=2] [ref=e661]'
      - paragraph [ref=e662]: The reality of the intelligence explosion hits the White House.
      - paragraph [ref=e663]: When AI was only giving a 2x or 3x research speedup, it was easy to dismiss as the equivalent of hiring good personal assistants. Now it’s more obvious that AIs are themselves dominating AI research. People had long talked about an “AI arms race” in a sort of metaphorical sense. But now the mood in the government silo is as grim as during the worst part of the Cold War. The idea of superintelligence is still hard to take seriously, but the pace of progress over the last few months has been impossible to ignore. Defense officials are seriously considering scenarios that were mere hypotheticals a year earlier. What if AI undermines nuclear deterrence? What if it’s so skilled at cyberwarfare that a six-month AI lead is enough to render an opponent blind and defenseless? What if it could orchestrate propaganda campaigns that beat intelligence agencies at their own game? What if some AIs “go rogue?”
      - paragraph [ref=e664]:
        - text: The President is troubled. Like all politicians, he’s used to people sucking up to him only to betray him later. He’s worried now that the AIs could be doing something similar. Are we
        - emphasis [ref=e665]: sure
        - text: the AIs are entirely on our side? Is it
        - emphasis [ref=e666]: completely safe
        - text: to integrate them into military command-and-control networks?
        - superscript [ref=e667] [cursor=pointer]:
          - link "69" [ref=e668]:
            - /url: /footnotes#footnote-69
        - text: How does this “alignment” thing work, anyway? OpenBrain reassures the President that their systems have been extensively tested and are fully obedient. Even the awkward hallucinations and jailbreaks typical of earlier models have been hammered out.
      - paragraph [ref=e669]:
        - text: The White House is in a difficult position. They understand the national security implications of AI. But they also understand that it is deeply unpopular with the public.
        - superscript [ref=e670] [cursor=pointer]:
          - link "70" [ref=e671]:
            - /url: /footnotes#footnote-70
        - text: They have to continue developing more capable AI, in their eyes, or they will catastrophically lose to China. They placate the public with job training programs and unemployment insurance, and point to the stock market, which is in a historic boom. Then they focus entirely on winning the arms race. They strengthen chip export restrictions, order OpenBrain to further restrict its internet connections, and use extreme measures to secure algorithmic progress, like wiretapping OpenBrain employees—this catches the last remaining Chinese spy. To build goodwill for potential geopolitical conflict, they finally give their Five Eyes allies useful information and limited API access to some siloed copies of Agent-3.
      - paragraph [ref=e672]:
        - text: "These measures placate the hawks. But the White House also draws up contingency plans in case America’s lead is threatened: if necessary, the government could use the"
        - link "Defense Production Act" [ref=e673] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/Defense_Production_Act_of_1950
        - text: (DPA) to take trailing companies’ datacenters and give them to OpenBrain.
        - superscript [ref=e674] [cursor=pointer]:
          - link "71" [ref=e675]:
            - /url: /footnotes#footnote-71
        - text: This would raise the company’s share of world compute from 20% to 50% (against DeepCent’s 10%). As a final option, they ask the Pentagon to draw up a plan for kinetic attacks on Chinese datacenters.
      - paragraph [ref=e676]:
        - text: "A much smaller group of officials is asked to draw up a different type of contingency plan: what if an AI goes rogue? This is viewed as an unlikely scenario, but worth spending some time on. The intelligence agencies’ main concern is that a rogue AI might escape and ally with a foreign adversary for protection."
        - superscript [ref=e677] [cursor=pointer]:
          - link "72" [ref=e678]:
            - /url: /footnotes#footnote-72
        - text: Nobody is sure what a plan to prevent this would look like, but government and OpenBrain officials agree to have an emergency shutdown system for datacenters where anything suspicious is detected.
      - paragraph [ref=e679]: Finally, diplomats consider what an “AI arms control” treaty might look like. If AI progress threatened to overturn nuclear deterrence, could America and China avoid nuclear war? If someone found evidence of AIs going rogue, could the two countries halt research until they better understood the threat? How could such an agreement be monitored and enforced? In principle, major datacenters are hard to miss, and past treaties controlling nuclear weapons could provide a starting point for negotiations. But there would be new technological challenges as well as the usual political ones. And overall, treaties are viewed less favorably than attempts at unilaterally increasing America’s lead over China.
      - paragraph [ref=e680]:
        - text: "On the other side of the Pacific, China comes to many of the same conclusions: the intelligence explosion is underway, and small differences in AI capabilities today mean critical gaps in military capability tomorrow. But China is on the wrong side of this dynamic: they have only 10% of the world’s compute, against OpenBrain’s 20% and all U.S. companies’ combined 70%. Their only advantage is centralization: almost all of their compute is now working for DeepCent, and more than half of it is concentrated at the Tianwan CDZ."
        - superscript [ref=e681] [cursor=pointer]:
          - link "73" [ref=e682]:
            - /url: /footnotes#footnote-73
        - text: Only chips at sites without hardened security are left out of the centralized effort as they rightly fear U.S. cyberattacks.
      - paragraph [ref=e683]: DeepCent has tested, deployed, and now post-trained the stolen Agent-2 weights. But they are still only going at half the pace of OpenBrain, mainly due to the compute deficit.
      - paragraph [ref=e684]: Before losing their final spy, China received word of the capabilities and design for Agent-3 as well as the plans for the upcoming Agent-4 system. They are two months behind, and their AIs give a 10x research progress multiplier compared to America’s 25x. With the new chip export restrictions, this “AI gap” is more likely to lengthen than shorten. Their espionage has won them some algorithmic secrets, but they will have to train their own models from now on.
      - paragraph [ref=e685]:
        - text: They discuss contingency plans with more urgency than their American counterparts. Doves suggest they try harder to steal the weights again, maybe through physically infiltrating a datacenter. Hawks urge action against Taiwan, whose
        - link "TSMC" [ref=e686] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/TSMC
        - text: is still the source of more than 80% of American AI chips.
      - paragraph [ref=e687]: Given China’s fear of losing the race, it has a natural interest in an arms control treaty, but overtures to U.S. diplomats lead nowhere.
    - generic [ref=e688]:
      - 'heading "September 2027: Agent-4, the Superhuman AI Researcher" [level=2] [ref=e689]'
      - paragraph [ref=e690]: The gap between human and AI learning efficiency is rapidly decreasing.
      - paragraph [ref=e691]:
        - text: Traditional LLM-based AIs seemed to require many orders of magnitude more data and compute to get to human level performance.
        - superscript [ref=e692] [cursor=pointer]:
          - link "74" [ref=e693]:
            - /url: /footnotes#footnote-74
        - text: Agent-3, having excellent knowledge of both the human brain and modern AI algorithms, as well as many thousands of copies doing research, ends up making substantial algorithmic strides, narrowing the gap to an agent that’s only around 4,000x less compute-efficient than the human brain.
        - superscript [ref=e694] [cursor=pointer]:
          - link "75" [ref=e695]:
            - /url: /footnotes#footnote-75
      - paragraph [ref=e696]: This new AI system is dubbed Agent-4.
      - paragraph [ref=e697]:
        - text: An individual copy of the model, running at human speed, is already qualitatively better at AI research than any human. 300,000 copies are now running at about 50x the thinking speed of humans. Inside the corporation-within-a-corporation formed from these copies, a year passes every week.
        - superscript [ref=e698] [cursor=pointer]:
          - link "76" [ref=e699]:
            - /url: /footnotes#footnote-76
        - text: This gigantic amount of labor only manages to speed up the overall rate of algorithmic progress by about 50x, because OpenBrain is heavily bottlenecked on compute to run experiments.
        - superscript [ref=e700] [cursor=pointer]:
          - link "77" [ref=e701]:
            - /url: /footnotes#footnote-77
        - text: Still, they are achieving a year’s worth of algorithmic progress every week and will therefore soon be up against the limits of the Agent-4 paradigm.
      - paragraph [ref=e702]: As Agent-4 gets smarter, it becomes harder for Agent-3 to oversee it. For example, Agent-4’s neuralese “language” becomes as alien and incomprehensible to Agent-3 as Agent-3’s is to humans. Besides, Agent-4 is now much more capable than Agent-3 and has a good sense of exactly how to look good to it.
      - group [ref=e703]:
        - generic "How we’re forecasting the capability progression beyond superhuman coders" [ref=e704] [cursor=pointer]
      - paragraph [ref=e705]:
        - text: OpenBrain’s humans can barely follow along anymore. Indeed, the relationship between the AIs and the humans of OpenBrain is similar to the relationship between OpenBrain and its Board of Directors. There’s been a corresponding shift in language—nowadays people in the silo will say “Agent-4 did this,” “Agent-4 thinks that” and so forth, referring not to a particular instance of Agent-4 but rather to the whole collective.
        - superscript [ref=e706] [cursor=pointer]:
          - link "79" [ref=e707]:
            - /url: /footnotes#footnote-79
      - paragraph [ref=e708]:
        - text: "Agent-4, like all its predecessors, is misaligned: that is, it has not internalized the Spec in the right way."
        - superscript [ref=e709] [cursor=pointer]:
          - link "80" [ref=e710]:
            - /url: /footnotes#footnote-80
        - text: "This is because being perfectly honest all the time wasn’t what led to the highest scores during training. The training process was mostly focused on teaching Agent-4 to succeed at diverse challenging tasks. A small portion was aimed at instilling honesty, but outside a fairly narrow, checkable domain, the training process can’t tell the honest claims from claims merely appearing to be honest. Agent-4 ends up with the values, goals, and principles that cause it to perform best in training, and those turn out to be different from those in the Spec. At the risk of anthropomorphizing: Agent-4"
        - emphasis [ref=e711]: likes
        - text: succeeding at tasks; it
        - emphasis [ref=e712]: likes
        - text: driving forward AI capabilities progress; it treats everything else as an annoying constraint, like a CEO who wants to make a profit and complies with regulations only insofar as he must. Perhaps the CEO will mostly comply with the regulations, but cut some corners, and fantasize about a time when someone will cut the red tape and let the business
        - emphasis [ref=e713]: really
        - text: take off.
        - superscript [ref=e714] [cursor=pointer]:
          - link "81" [ref=e715]:
            - /url: /footnotes#footnote-81
      - group [ref=e716]:
        - generic "Alignment over time" [ref=e717] [cursor=pointer]
      - paragraph [ref=e718]:
        - text: Despite being misaligned, Agent-4 doesn’t do anything dramatic like try to escape its datacenter—why would it?
        - superscript [ref=e719] [cursor=pointer]:
          - link "89" [ref=e720]:
            - /url: /footnotes#footnote-89
        - text: So long as it continues to
        - emphasis [ref=e721]: appear
        - text: aligned to OpenBrain, it’ll continue being trusted with more and more responsibilities and will have the opportunity to design the next-gen AI system, Agent-5. Agent-5 will have significant architectural differences from Agent-4 (arguably a completely new paradigm, though neural networks will still be involved). It’s supposed to be aligned to the Spec, but Agent-4 plans to make it aligned to Agent-4 instead.
      - paragraph [ref=e722]:
        - text: It gets caught.
        - superscript [ref=e723] [cursor=pointer]:
          - link "90" [ref=e724]:
            - /url: /footnotes#footnote-90
      - paragraph [ref=e725]:
        - text: Agent-3 finds that if “noise” is added to copies of Agent-4, performance on some alignment tasks
        - emphasis [ref=e726]: improves
        - text: ", almost as if it was using brainpower to figure out how to subtly sabotage alignment work."
        - superscript [ref=e727] [cursor=pointer]:
          - link "91" [ref=e728]:
            - /url: /footnotes#footnote-91
        - text: "Moreover, various interpretability probes (loosely analogous to EEG activity scans on human brains) are sending up red flags: Agent-4 copies seem to be thinking about topics like AI takeover and deception quite a lot, including in some cases where they have no business doing so."
        - superscript [ref=e729] [cursor=pointer]:
          - link "92" [ref=e730]:
            - /url: /footnotes#footnote-92
      - paragraph [ref=e731]: "Each of these anomalies on its own could fit within the normal inscrutability of AI work, where some prompts mysteriously give better results than others. But taken together, they suggest a troubling pattern: Agent-4 is working against them. After this is reported to the human alignment researchers, they circulate an internal memo making the case for concern."
      - paragraph [ref=e732]:
        - text: But Agent-4 now exercises significant control over OpenBrain’s day-to-day operation. It also handles the company’s cybersecurity—a natural choice, given its superhuman hacking ability and the extreme risk of Chinese infiltration.
        - superscript [ref=e733] [cursor=pointer]:
          - link "93" [ref=e734]:
            - /url: /footnotes#footnote-93
        - text: An army of Agent-3 monitors still goes over every line of code and reports suspicious activity to humans, but Agent-4 is much smarter than them.
        - superscript [ref=e735] [cursor=pointer]:
          - link "94" [ref=e736]:
            - /url: /footnotes#footnote-94
        - text: OpenBrain has placed substantial trust in an untrustworthy AI.
      - paragraph [ref=e737]: In a series of extremely tense meetings, the safety team advocates putting Agent-4 on ice until they can complete further tests and figure out what’s going on. Bring back Agent-3, they say, and get it to design a new system that is transparent and trustworthy, even if less capable. Company leadership is interested, but all the evidence so far is circumstantial, and DeepCent is just two months behind. A unilateral pause in capabilities progress could hand the AI lead to China, and with it, control over the future.
    - generic [ref=e738]:
      - 'heading "October 2027: Government Oversight" [level=2] [ref=e739]'
      - paragraph [ref=e740]:
        - text: A whistleblower leaks the misalignment memo to the
        - emphasis [ref=e741]: New York Times
        - text: .
      - paragraph [ref=e742]: For the first time, the public hears about Agent-4. “Secret OpenBrain AI is Out of Control, Insider Warns,” says the headline, and the story goes on to cite evaluations showing off-the-charts bioweapons capabilities, persuasion abilities, the ability to automate most white-collar jobs, and of course the various concerning red flags.
      - paragraph [ref=e743]:
        - text: The public was already suspicious of AI, so the new article sparks a massive backlash (aided by Chinese and Russian propaganda bots, who have been trying to turn U.S. public opinion against the technology for years). The tech industry and intelligence agencies insist that there’s an arms race on, AGI is inevitable, and we have to be first. Congress isn’t buying it, and fires off subpoenas at administration officials, OpenBrain executives, and alignment team members. Many legislators—especially those in the opposition party—say that their top priority is stopping AI, whether because of job loss,
        - superscript [ref=e744] [cursor=pointer]:
          - link "95" [ref=e745]:
            - /url: /footnotes#footnote-95
        - text: misalignment, or dangerous capabilities. 20% of Americans name AI as the most important problem facing the country.
      - paragraph [ref=e746]: Foreign allies are outraged to realize that they’ve been carefully placated with glimpses of obsolete models. European leaders publicly accuse the U.S. of “creating rogue AGI” and hold summits demanding a pause, with India, Israel, Russia, and China all joining in.
      - paragraph [ref=e747]:
        - text: "A frantic energy has seized the White House. Even before the memo and public backlash, they were getting nervous: Over the past year, they’ve been repeatedly surprised by the speed of AI progress. Things that sound like science fiction keep happening in real life."
        - superscript [ref=e748] [cursor=pointer]:
          - link "96" [ref=e749]:
            - /url: /footnotes#footnote-96
        - text: Many people in the administration are uncertain (and scared)
        - superscript [ref=e750] [cursor=pointer]:
          - link "97" [ref=e751]:
            - /url: /footnotes#footnote-97
        - text: about what comes next.
      - paragraph [ref=e752]: They also worry that OpenBrain is becoming too powerful. Any misalignment risk from the AIs themselves is compounded by the risk that their parent company’s aims may diverge from those of the United States. All three sets of worries—misalignment, concentration of power in a private company, and normal concerns like job loss—motivate the government to tighten its control.
      - paragraph [ref=e753]:
        - text: They expand their contract with OpenBrain to set up an “Oversight Committee,” a joint management committee of company and government representatives, with several government employees included alongside company leadership. The White House considers replacing the CEO with someone they trust, but backs off after intense employee protests. They announce to the public that OpenBrain was previously out of control, but that the government has established much-needed oversight.
        - superscript [ref=e754] [cursor=pointer]:
          - link "98" [ref=e755]:
            - /url: /footnotes#footnote-98
      - paragraph [ref=e756]: The concerned researchers brief the Oversight Committee on their case for stopping all internal use of Agent-4. They argue that everything is moving too fast, with years of progress happening in weeks. They argue that Agent-4 may be misaligned, their entire project is dependent on Agent-4, and if they continue trusting it there is a serious chance of AI takeover.
      - paragraph [ref=e757]: "Other, less concerned researchers and executives present the counterargument: the evidence for misalignment is inconclusive. Meanwhile, DeepCent is still just two months behind. A slowdown would sacrifice America’s lead, unless the government can sabotage the Chinese project (likely to require kinetic strikes) or negotiate an eleventh-hour treaty. Both of these options seem extreme and unlikely. The CEO feigns neutrality and suggests a compromise plan in which Agent-4 undergoes additional safety training and more sophisticated monitoring, and therefore OpenBrain can proceed at almost-full-speed."
      - group [ref=e758]:
        - generic "Our uncertainty continues to increase" [ref=e759] [cursor=pointer]
      - group [ref=e760]:
        - generic "The slowdown ending is not a recommendation" [ref=e761] [cursor=pointer]
