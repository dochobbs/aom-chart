    - generic [ref=e586]:
      - 'heading "June 2027: Self-improving AI" [level=2] [ref=e587]'
      - paragraph [ref=e588]:
        - text: OpenBrain now has a “
        - link "country of geniuses in a datacenter" [ref=e589] [cursor=pointer]:
          - /url: https://darioamodei.com/machines-of-loving-grace#basic-assumptions-and-framework
        - text: .”
      - paragraph [ref=e590]: Most of the humans at OpenBrain can’t usefully contribute anymore. Some don’t realize this and harmfully micromanage their AI teams. Others sit at their computer screens, watching performance crawl up, and up, and up. The best human AI researchers are still adding value. They don’t code any more. But some of their research taste and planning ability has been hard for the models to replicate. Still, many of their ideas are useless because they lack the depth of knowledge of the AIs. For many of their research ideas, the AIs immediately respond with a report explaining that their idea was tested in-depth 3 weeks ago and found unpromising.
      - paragraph [ref=e591]: These researchers go to bed every night and wake up to another week worth of progress made mostly by the AIs. They work increasingly long hours and take shifts around the clock just to keep up with progress—the AIs never sleep or rest. They are burning themselves out, but they know that these are the last few months that their labor matters.
      - paragraph [ref=e592]: Within the silo, “Feeling the AGI” has given way to “Feeling the Superintelligence.”
