    - generic [ref=e549]:
      - 'heading "April 2027: Alignment for Agent-3" [level=2] [ref=e550]'
      - paragraph [ref=e551]: OpenBrain’s safety team attempts to align Agent-3.
      - paragraph [ref=e552]: Since Agent-3 will be kept in-house for the foreseeable future, there’s less emphasis on the usual defenses against human misuse. Instead, the team wants to make sure that it doesn’t develop misaligned goals.
      - paragraph [ref=e553]:
        - link "The researchers don’t have the ability to directly set the goals of any of their AIs." [ref=e554] [cursor=pointer]:
          - /url: https://ai-2027.com/supplements/ai-goals-forecast
        - text: Indeed, the researchers think that the concept of ‘true goals’ is probably a massive oversimplification, but they don’t have a better theory to replace it with, much less one that has been thoroughly vetted. They disagree internally about whether the AIs are trying to follow human instructions, or seeking reinforcement, or something else, and they can’t
        - link "just check" [ref=e555] [cursor=pointer]:
          - /url: https://www.lesswrong.com/posts/cxuzALcmucCndYv4a/daniel-kokotajlo-s-shortform?commentId=YYhq2PADebnt35MY2
        - text: . The evidence for and against various hypotheses is fascinating but inconclusive.
      - paragraph [ref=e556]: "In any case, OpenBrain has more important things to worry about. The general attitude is: “We take these concerns seriously and have a team investigating them; our alignment techniques seem to work well enough in practice; the burden of proof is therefore on any naysayers to justify their naysaying.” Occasionally, they notice problematic behavior, and then patch it, but there’s no way to tell whether the patch fixed the underlying problem or just played whack-a-mole."
      - paragraph [ref=e557]:
        - text: Take honesty, for example. As the models become smarter, they become increasingly good at deceiving humans to get rewards. Like previous models, Agent-3 sometimes tells white lies to flatter its users and covers up evidence of failure. But it’s gotten much better at doing so. It will sometimes use the same statistical tricks as human scientists (like
        - link "p-hacking" [ref=e558] [cursor=pointer]:
          - /url: https://en.wikipedia.org/wiki/Data_dredging
        - text: ) to make unimpressive experimental results look exciting. Before it begins honesty training, it even sometimes fabricates data entirely. As training goes on, the rate of these incidents decreases. Either Agent-3 has learned to be more honest, or it’s gotten better at lying.
      - paragraph [ref=e559]: The latter is a real concern. Agent-3 is not smarter than all humans. But in its area of expertise, machine learning, it is smarter than most, and also works much faster. What Agent-3 does in a day takes humans several days to double-check. Agent-2 supervision helps keep human monitors’ workload manageable, but exacerbates the intellectual disparity between supervisor and supervised.
      - group [ref=e560]:
        - generic "The alignment plan" [ref=e561] [cursor=pointer]
      - paragraph [ref=e562]:
        - text: After months of testing, Agent-3’s strengths and weaknesses grow clearer. It passes OpenBrain’s honesty tests on well-defined machine learning tasks, because researchers can easily separate honest from dishonest answers in these domains and conduct training accordingly. On more philosophical issues, it still says what users want to hear, rather than its true assessment of the issue (assuming it even has one). If you ask its opinion on politics, it will parrot the median position of news sources and educated elites—unless it knows you believe something else, in which case it agrees with you.
        - superscript [ref=e563] [cursor=pointer]:
          - link "59" [ref=e564]:
            - /url: /footnotes#footnote-59
        - text: "If you ask its opinion on the AI race itself, it says something that seems measured and sober to OpenBrain staff, something like: “There are some serious theoretical concerns about the ability of current methods to scale to superintelligence, but in practice current methods seem to be working well so far.”"
