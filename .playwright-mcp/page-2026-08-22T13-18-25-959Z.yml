      - 'heading "Early 2026: Coding Automation" [level=2] [ref=e271]'
      - paragraph [ref=e272]: The bet of using AI to speed up AI research is starting to pay off.
      - paragraph [ref=e273]: OpenBrain continues to deploy the iteratively improving Agent-1 internally for AI R&D. Overall, they are making algorithmic progress 50% faster than they would without AI assistants—and more importantly, faster than their competitors.
      - group [ref=e274]:
        - 'generic "The AI R&D progress multiplier: what do we mean by 50% faster algorithmic progress?" [ref=e275] [cursor=pointer]'
      - paragraph [ref=e276]:
        - text: Several competing publicly released AIs now match or exceed Agent-0, including an
        - link "open-weights" [ref=e277] [cursor=pointer]:
          - /url: https://opensource.org/ai/open-weights
        - text: model. OpenBrain responds by releasing Agent-1, which is more capable and reliable.
        - superscript [ref=e278] [cursor=pointer]:
          - link "28" [ref=e279]:
            - /url: /footnotes#footnote-28
      - paragraph [ref=e280]:
        - text: People naturally try to compare Agent-1 to humans, but it has a very different skill profile. It knows more facts than any human, knows practically every programming language, and can solve well-specified coding problems extremely quickly. On the other hand, Agent-1 is bad at even simple long-horizon tasks, like beating video games it hasn’t played before. Still, the common workday is eight hours, and a day’s work can usually be separated into smaller chunks; you could think of Agent-1 as a scatterbrained employee who thrives under careful management.
        - superscript [ref=e281] [cursor=pointer]:
          - link "29" [ref=e282]:
            - /url: /footnotes#footnote-29
        - text: Savvy people find ways to automate routine parts of their jobs.
        - superscript [ref=e283] [cursor=pointer]:
          - link "30" [ref=e284]:
            - /url: /footnotes#footnote-30
      - paragraph [ref=e285]:
        - text: "OpenBrain’s executives turn consideration to an implication of automating AI R&D: security has become more important. In early 2025, the worst-case scenario was leaked algorithmic secrets; now, if China steals Agent-1’s weights, they could increase their research speed by nearly 50%."
        - superscript [ref=e286] [cursor=pointer]:
          - link "31" [ref=e287]:
