      - paragraph [ref=e226]:
        - text: "Although models are improving on a wide range of skills, one stands out: OpenBrain focuses on AIs that can speed up AI research. They want to win the twin arms races against China (whose leading company we’ll call “DeepCent”)"
        - superscript [ref=e227] [cursor=pointer]:
