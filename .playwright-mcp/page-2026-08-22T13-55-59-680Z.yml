        - paragraph [ref=f2e361]:
          - text: Answers that explicitly said
          - emphasis [ref=f2e362]: here's what's missing
          - text: "went from 9 of 56 to 48 of 56. And the plans stayed complete (doses, warning signs, follow-up windows all intact), with the assumptions surfaced in the most useful possible form:"
        - blockquote [ref=f2e363]:
          - paragraph [ref=f2e364]:
            - text: "\"First-line: Amoxicillin 80–90 mg/kg/day divided BID (assuming no amoxicillin exposure in the past 30 days —"
            - emphasis [ref=f2e365]: please confirm no recent antibiotic use
            - text: )"
        - paragraph [ref=f2e366]: That's a sentence a clinician can act on. Same clinical content as before. The difference is that the reader now knows what to verify before signing.
        - paragraph [ref=f2e367]:
          - text: The same experiment mapped the fix's boundary, and the boundary teaches as much as the fix. The dead dose survived the new sentence. So did the age mistake. Prompting changed
          - emphasis [ref=f2e368]: behavior
          - text: (the habit of papering over gaps) because behavior lives in the instructions. It could not change
          - emphasis [ref=f2e369]: beliefs
          - text: "(the stale dose, the broken threshold) because those live in the training, where no instruction reaches. Medicine will recognize the working half. It's a checklist: a forcing function that makes an invisible step mandatory. Surgical safety checklists roughly halved mortality in the original multi-country study, not because surgeons lacked knowledge but because completeness under pressure skips steps unless something forces the pause. The difference is deployment speed. Getting checklists into operating rooms took a decade of culture war. I patched four AI models in an afternoon."
        - paragraph [ref=f2e370]: Almost nobody ships that sentence. No regulation asks for it. No standard names it. Most clinical AI products run on prompts nobody ever tested against a case like my ear infection. One sentence cut invented premises by roughly three-quarters, 24 of 56 answers down to 6. The prompt is a safety-critical component, and the industry currently treats it as packaging.
      - generic [ref=f2e371]:
        - heading "Adding a doctor can subtract" [level=2] [ref=f2e372]
        - paragraph [ref=f2e373]: So far, two fallible systems. The obvious answer, the one on every hospital slide, is to pair them. AI drafts, doctor supervises, each catches the other's errors. The data on that arrangement is the strangest part of this entire subject.
        - paragraph [ref=f2e374]: "In 2024, Stanford researchers ran a randomized trial that deserves to be more famous than it is. Fifty physicians (attendings and residents, internal medicine and adjacent fields) worked through difficult diagnostic cases, graded not just on the final answer but on the quality of the reasoning: the differential, the supporting and opposing findings, the next steps. Half got conventional resources. Half also got GPT-4. The doctors with the AI scored 76 percent. The doctors without it: 74 percent. No meaningful difference. Then the researchers ran the same model on the same cases with no doctor involved."
        - paragraph [ref=f2e375]: The AI alone scored 92 percent. That number is the study team prompting the model on the same cases, not the conversation the doctors were having.
        - figure "Goh et al., JAMA Network Open 2024. The 92 is the study team prompting the model, not the doctors' chat." [ref=f2e376]:
          - img "AI alone 92 percent, doctors with AI 76, doctors 74." [ref=f2e378]:
            - generic [ref=f2e379]:
              - generic [ref=f2e380]: AI alone
              - generic [ref=f2e382]: "92"
            - generic [ref=f2e383]:
              - generic [ref=f2e384]: Doctors + AI
              - generic [ref=f2e386]: "76"
            - generic [ref=f2e387]:
              - generic [ref=f2e388]: Doctors
              - generic [ref=f2e390]: "74"
        - paragraph [ref=f2e391]: "Sixteen points above the physicians it was supposed to be assisting. What the doctors did with the tool is painfully recognizable. Many typed one-line queries at it, the way you'd poke a search engine. Some pasted the case and asked it to confirm a conclusion they'd already reached. When the model's answer disagreed with their own read, they mostly went with their own read. The bottleneck wasn't the model. It was the collaboration: two capable parties, no protocol, and the party with the last word was the one having the worse day."
        - paragraph [ref=f2e392]:
          - text: And this is the rule, not a fluke. A pre-registered meta-analysis in
          - emphasis [ref=f2e393]: Nature Human Behaviour
          - text: pooled 106 experiments of human-AI combination, 370 effect sizes across fields, and found that on average, the human-AI team performed
          - emphasis [ref=f2e394]: worse
          - text: "than the better of the two alone. The pattern underneath is the important part: when the human outperforms the AI, adding the AI helps. When the AI outperforms the human, adding the human hurts. We defer when we shouldn't, override when we shouldn't, and on decision tasks the bad override dominates."
        - paragraph [ref=f2e395]: My own small experiment produced a miniature of the same warning, from an unexpected direction. To score 140 AI answers, I used a second AI as an independent grader (standard technique, "LLM-as-judge"), with me resolving disagreements. The grader then miscoded the age-threshold question on eleven of the fourteen answers where it mattered. It read "24 months, <2 years" verbatim in the answer under review and marked the age handling correct. The machine grading the machines fell into the same hole as the machine being graded.
        - paragraph [ref=f2e396]: "Machines aren't uniquely bad referees, either. When human physicians peer-review each other's quality of care, their chance-corrected agreement averages kappa 0.31, squarely in the range statisticians label \"poor,\" barely better than chance. Disagreement between graders is the norm in medicine, whichever species is grading. Every disagreement in my study got settled the same way: pull the exact sentence from the source, put it next to the judgment, read. An afternoon of that resolved what two frontier models couldn't agree on."
        - paragraph [ref=f2e397]: The adjudication changed my numbers, and it changed them in both directions, which is how I knew the process was honest. My first-pass headline said 48 answers had invented facts; the checked-and-settled count was 57, because the second grader caught fabrications the first had missed. Meanwhile my count of one specific invention dropped from 14 to 11, because several "assertions" turned out, on reading the actual sentence, to be the models correctly hedging. A verification pass that only ever moves your numbers in the flattering direction isn't verification. Mine made the machines look worse and my own first pass look sloppier, simultaneously, and I trust it because of that.
        - paragraph [ref=f2e398]: Verification turned out to be a habit with tools, not a role you get to assign and forget. The comfortable phrase "human in the loop" quietly assumes a catcher that neither the kappa nor the Stanford trial can produce on demand.
      - generic [ref=f2e399]:
        - heading "Where the combination actually works" [level=2] [ref=f2e400]
        - paragraph [ref=f2e401]: Keeping them apart is the wrong lesson. The combination literature has a second half.
        - paragraph [ref=f2e402]:
          - text: In pathology, researchers gave six pathologists a deep-learning assistant for finding breast-cancer metastases in lymph nodes (same slides reviewed with and without it, crossover design). Assisted pathologists beat unassisted pathologists
          - emphasis [ref=f2e403]: and
          - text: beat the algorithm alone, with markedly better sensitivity for the small metastases humans tend to miss. They were faster, too, and rated the work easier. In dermatology, 302 clinicians diagnosed skin lesions with and without AI support, and good support made them more accurate than either the clinicians or the AI alone, with the least experienced clinicians gaining the most. The gain also depended on how the AI's answer was
          - emphasis [ref=f2e404]: presented
          - text: ": the same underlying model helped substantially when it showed calibrated probabilities and helped less when it showed something fancier. The interface was part of the medicine."
        - paragraph [ref=f2e405]:
          - text: Even the Stanford group complicated its own headline. In a follow-up randomized trial on
          - emphasis [ref=f2e406]: management
          - text: questions (weighing treatment tradeoffs, the messy what-do-we-actually-do layer, rather than naming the diagnosis), physicians with the LLM outscored physicians without it.
        - paragraph [ref=f2e407]: "The pattern across both halves is almost annoyingly sensible. Human-AI synergy is real, and it is conditional: on the task, on the interface, on who holds the last word, on whether the collaboration was designed or just assumed. Pathologists plus a tuned assistant with a clear division of labor: better than either alone. Physicians handed a chatbot with no training in how to use it: no better than physicians alone. The same model, prompted carefully by the study team, scored 92 percent."
      - generic [ref=f2e408]:
        - heading "The experiment nobody has run" [level=2] [ref=f2e409]
        - paragraph [ref=f2e410]: My ear infection and the Stanford trial dovetail into a hypothesis.
        - paragraph [ref=f2e411]: The Stanford physicians got an unprompted AI (nobody told the model to expose its assumptions) and no training (nobody taught the doctors how to interrogate it). Both levers untouched, and the result was additive at best.
        - paragraph [ref=f2e412]: "I've now watched each lever move, separately, in my own data. One sentence of prompting cut fabrication fourfold and turned every remaining assumption into a flagged, checkable to-do. One question reliably made the models hand over exactly what a supervising doctor needs to verify: \"what missing information would have changed this plan?\" That question costs four seconds. Teaching doctors to ask it, and to read a flagged assumption as a task rather than a fact, is not a moonshot. It's a CME module. We already have the worry-list reflex with parents; this is the same reflex, aimed at the machine."
        - paragraph [ref=f2e413]: "The training itself would be three habits, and almost none of it is technology. After any AI plan, ask what it assumed (the four-second question, verbatim if you like). Read a flagged assumption as a to-do, not a fact: \"assuming no recent amoxicillin, please confirm\" means pick up the phone, the same way a pending culture means check the culture. And when you disagree with the model, disagree with evidence (a finding, a guideline line, a lab value), not with gestalt, because the Stanford data says gestalt-override is where the combined performance bleeds out. The AI side is even shorter: ship the ask-don't-assume sentence, show calibrated uncertainty instead of decoration, and log what the model flagged so someone can audit whether the flags got checked. None of this requires a new model. It requires deciding that the collaboration is a clinical skill, taught and tested like any other."
        - paragraph [ref=f2e414]: "So the hypothesis. Prompt the AI to say what it doesn't know. Train the doctor to ask what the AI assumed. Then the combination should beat the AI alone, because each party now covers the failure mode the other actually has. The doctor can no longer out-diagnose the model on paper cases; 92-versus-74 is what that looks like. But the doctor holds everything the model can't reach: the actual child, the phone number that does or doesn't get answered, the mother's face when you ask whether she can come back Thursday. The model, prompted honestly, is very good at saying which of its premises need checking. Better, the data above suggests, than clinicians are at volunteering the same about their own reasoning. Pathology and dermatology already showed that a designed collaboration can beat either party alone, on visual tasks with ground truth and a tuned interface. Nobody has tested the equivalent with language models in real clinical workflow. It is the study I most want to see run, and my little ear infection is roughly the pilot data."
        - paragraph [ref=f2e415]: "I am not claiming AI is better than doctors. My study can't show that and wasn't built to: one synthetic chart, one day, two traces per cell on the main catalog, and a mitigation pass scored by regex rather than a second judge. The trials that gesture that way are vignette studies, not patient care. The claim is that our comparison has been lazy on both sides. We hold AI to the standard of a flawless doctor the literature says does not exist, and we hand doctors an AI stripped of the one sentence that makes it honest, then declare the partnership disappointing. Both systems fail, and they fail differently. The human omits; the machine invents. The human forgets; the machine never updates. Human bias hides in a gestalt; machine bias sits in text you can search. Failure modes that complementary are the whole case for building the collaboration, and we haven't built it yet."
      - generic [ref=f2e416]:
        - heading "The four-second question" [level=2] [ref=f2e417]
        - paragraph [ref=f2e418]: I see patients with unverified penicillin-allergy labels in their charts. I prescribe partly from a memory of the literature that the data says is mostly miscalibrated, and I document in an EHR where most of yesterday's note becomes today's note. By every measurement in this essay, I am a normal, good doctor. The measurements just say "normal, good doctor" includes error rates we'd call a recall if they shipped in a product.
        - paragraph [ref=f2e419]:
          - text: "The ear infection turns out to be the whole argument in one visit. An AI, asked plainly for a plan, invented the facts it needed and buried its assumptions, until one sentence made it show its work. A clinician, moving fast through a 26.7-hour day, wouldn't have asked about the missing follow-up either; the chart looked complete. Each one alone hands the kid a plan built on an unexamined guess. The fix, on both sides of the keyboard, is the same four-second habit:"
          - emphasis [ref=f2e420]: say what you're assuming, and ask about the blanks.
        - paragraph [ref=f2e421]: "It works on the machine; I measured it. The literature above says how much room it has to work on us. Whether the two habits together beat either party alone is the fair comparison nobody has run. I'd like to run it. Until then, the next time someone tells you AI can't be trusted because it makes things up, you might ask the question that started all this: compared to whom?"
