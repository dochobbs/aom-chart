        - text: is careful enough to wonder whether these victories are deep or shallow. Does the fully-trained model have some kind of robust commitment to always being honest? Or will this fall apart in some future situation, e.g. because it’s learned honesty as an
        - link "instrumental" [ref=e263] [cursor=pointer]:
