            - /url: /footnotes#footnote-16
        - text: and their U.S. competitors. The more of their research and development (R&D) cycle they can automate, the faster they can go. So when OpenBrain finishes training Agent-1, a new model under internal development, it’s good at many things but
        - emphasis [ref=e229]: great
        - text: at helping with AI research.
        - superscript [ref=e230] [cursor=pointer]:
          - link "17" [ref=e231]:
            - /url: /footnotes#footnote-17
        - text: By this point “finishes training” is a bit of a misnomer; models are frequently updated to newer versions trained on additional data or partially re-trained to patch some weaknesses.
        - superscript [ref=e232] [cursor=pointer]:
          - link "18" [ref=e233]:
            - /url: /footnotes#footnote-18
      - paragraph [ref=e234]:
        - text: The same training environments that teach Agent-1 to autonomously code and web-browse also make it a good hacker. Moreover, it could offer
        - link "substantial help" [ref=e235] [cursor=pointer]:
          - /url: https://x.com/lucafrighetti/status/1894550297449828434
        - text: to terrorists designing bioweapons, thanks to its PhD-level knowledge of every field and ability to browse the web. OpenBrain reassures the government that the model has been “aligned” so that it will refuse to comply with malicious requests.
      - paragraph [ref=e236]:
        - text: "Modern AI systems are gigantic artificial neural networks. Early in training, an AI won’t have “goals” so much as “reflexes”: If it sees “Pleased to meet”, it outputs “ you”. By the time it has been trained to predict approximately one internet’s worth of text, it’ll have developed sophisticated internal circuitry that encodes vast amounts of knowledge and flexibly role-plays as arbitrary authors, since that’s what helps it predict text with"
        - link "superhuman" [ref=e237] [cursor=pointer]:
          - /url: https://arxiv.org/pdf/2212.11281
        - text: accuracy.
        - superscript [ref=e238] [cursor=pointer]:
          - link "19" [ref=e239]:
            - /url: /footnotes#footnote-19
      - paragraph [ref=e240]:
        - text: After being trained to predict internet text, the model is trained to
        - emphasis [ref=e241]: produce
        - text: text in response to instructions. This bakes in a basic personality and “drives.”
        - superscript [ref=e242] [cursor=pointer]:
          - link "20" [ref=e243]:
            - /url: /footnotes#footnote-20
        - text: For example, an agent that understands a task clearly is more likely to complete it successfully; over the course of training the model “learns” a “drive” to get a clear understanding of its tasks. Other drives in this category might be effectiveness, knowledge, and self-presentation (i.e. the tendency to frame its results in the best possible light).
        - superscript [ref=e244] [cursor=pointer]:
          - link "21" [ref=e245]:
            - /url: /footnotes#footnote-21
      - paragraph [ref=e246]:
        - text: OpenBrain has
        - link "a model specification" [ref=e247] [cursor=pointer]:
          - /url: https://model-spec.openai.com/2025-02-12.html
        - text: (or “Spec”), a written document describing the goals, rules, principles, etc. that are supposed to guide the model’s behavior.
        - superscript [ref=e248] [cursor=pointer]:
          - link "22" [ref=e249]:
            - /url: /footnotes#footnote-22
        - text: Agent-1’s Spec combines a few vague goals (like “assist the user” and “don’t break the law”) with a long list of more specific dos and don’ts (“don’t say this particular word,” “here’s how to handle this particular situation”). Using techniques that utilize AIs to train other AIs,
        - superscript [ref=e250] [cursor=pointer]:
          - link "23" [ref=e251]:
            - /url: /footnotes#footnote-23
        - text: the model memorizes the Spec and learns to reason carefully about its maxims. By the end of
        - emphasis [ref=e252]: this
        - text: training, the AI will hopefully be
        - emphasis [ref=e253]: helpful
        - text: (obey instructions),
        - emphasis [ref=e254]: harmless
        - text: (refuse to help with scams, bomb-making, and other dangerous activities) and
        - emphasis [ref=e255]: honest
        - text: (resist the temptation to get better ratings from gullible humans by hallucinating citations
        - superscript [ref=e256] [cursor=pointer]:
          - link "24" [ref=e257]:
            - /url: /footnotes#footnote-24
        - text: or faking task completion).
      - group [ref=e258]:
